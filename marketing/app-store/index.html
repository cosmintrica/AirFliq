<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirFliq native App Store media</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px; background: #05060b; color: #f7f8ff; }
    header { max-width: 880px; margin: 0 auto 44px; }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 5vw, 64px); letter-spacing: -.045em; }
    p { margin: 0; color: #a7b0c3; font-size: 18px; line-height: 1.55; }
    main { display: grid; gap: 28px; max-width: 1440px; margin: 0 auto; }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; border-radius: 18px; border: 1px solid rgba(255,255,255,.12); }
    figcaption { margin-top: 10px; color: #7f899d; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Native Retina. No mock UI.</h1>
    <p>Every AirFliq interface below comes from macOS window capture. This page is only a local review gallery. The final PNG files are 2880 by 1800 with no alpha channel.</p>
  </header>
  <main>
    <figure><img src="final/01-airdrop-one-move.png" alt="AirFliq ready screen"><figcaption>01 - AirDrop in one move</figcaption></figure>
    <figure><img src="final/02-drag-drop-fliq.png" alt="AirFliq drag target"><figcaption>02 - Drag, drop, Fliq</figcaption></figure>
    <figure><img src="final/03-four-ways.png" alt="AirFliq file picker"><figcaption>03 - Four ways, one AirDrop</figcaption></figure>
    <figure><img src="final/04-your-shortcut.png" alt="AirFliq shortcut selection"><figcaption>04 - Your shortcut, your way</figcaption></figure>
  </main>
</body>
</html>
